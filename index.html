<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting...</title>
  <!-- Fallback HTML meta refresh in case JavaScript is disabled -->
  <meta http-equiv="refresh" content="2;url=https://win88bdt.com/" />
  
  <style>
    /* Reset & Base Styles */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-dark: #07090f;
      --bg-accent-1: #0f172a;
      --bg-accent-2: #064e3b;
      --primary-glow: #10b981;
      --primary-bright: #34d399;
      --gold-accent: #fbbf24;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --glass-bg: rgba(15, 23, 42, 0.65);
      --glass-border: rgba(255, 255, 255, 0.08);
    }

    html, body {
      height: 100%;
      width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
      background-color: var(--bg-dark);
      color: var(--text-main);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Animated Deep Rich Background */
    .bg-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: radial-gradient(circle at 20% 20%, rgba(16, 185, 129, 0.14) 0%, transparent 45%),
                  radial-gradient(circle at 80% 80%, rgba(251, 191, 36, 0.1) 0%, transparent 45%),
                  linear-gradient(135deg, #05070c 0%, #0b1120 50%, #061318 100%);
      background-size: 200% 200%;
      animation: gradientShift 12s ease infinite;
    }

    /* Ambient Floating Glow Orbs */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.45;
      pointer-events: none;
      animation: floatOrb 10s ease-in-out infinite alternate;
    }

    .orb-1 {
      width: 320px;
      height: 320px;
      background: rgba(16, 185, 129, 0.28);
      top: -80px;
      left: -60px;
    }

    .orb-2 {
      width: 280px;
      height: 280px;
      background: rgba(245, 158, 11, 0.2);
      bottom: -60px;
      right: -40px;
      animation-delay: -5s;
    }

    /* Main Center Container */
    .container {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    /* Glassmorphic Card */
    .card {
      width: 100%;
      max-width: 420px;
      padding: 2.75rem 2rem;
      border-radius: 28px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7),
                  inset 0 1px 0 0 rgba(255, 255, 255, 0.1);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.75rem;
      opacity: 0;
      transform: translateY(18px) scale(0.98);
      animation: cardEntrance 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Minimal Status Indicator */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.9rem;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.07);
      font-size: 0.8125rem;
      font-weight: 500;
      letter-spacing: 0.03em;
      color: var(--text-muted);
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--primary-bright);
      box-shadow: 0 0 10px var(--primary-glow);
      animation: dotPulse 1.4s ease-in-out infinite;
    }

    /* Typography */
    .title {
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text-main);
      line-height: 1.3;
    }

    /* Large Glowing CONTINUE Button */
    .continue-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      width: 100%;
      padding: 1.15rem 2rem;
      border-radius: 18px;
      border: none;
      text-decoration: none;
      font-size: 1.125rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #03150e;
      background: linear-gradient(135deg, #34d399 0%, #10b981 50%, #059669 100%);
      box-shadow: 0 0 28px rgba(16, 185, 129, 0.45),
                  0 10px 20px -5px rgba(16, 185, 129, 0.35),
                  inset 0 1px 1px rgba(255, 255, 255, 0.45);
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1),
                  box-shadow 0.25s ease,
                  filter 0.25s ease;
      animation: buttonGlow 2.4s ease-in-out infinite;
    }

    .continue-btn:hover {
      transform: translateY(-2px) scale(1.015);
      filter: brightness(1.06);
      box-shadow: 0 0 40px rgba(52, 211, 153, 0.7),
                  0 14px 28px -6px rgba(16, 185, 129, 0.5),
                  inset 0 1px 1px rgba(255, 255, 255, 0.6);
    }

    .continue-btn:active {
      transform: translateY(1px) scale(0.985);
    }

    .continue-btn svg {
      width: 20px;
      height: 20px;
      transition: transform 0.22s ease;
    }

    .continue-btn:hover svg {
      transform: translateX(4px);
    }

    /* Smooth 2-Second Progress Track */
    .progress-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .progress-track {
      width: 100%;
      height: 4px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 9999px;
      background: linear-gradient(90deg, var(--primary-glow), var(--primary-bright), var(--gold-accent));
      box-shadow: 0 0 12px rgba(52, 211, 153, 0.6);
      animation: fillProgress 2s linear forwards;
    }

    /* Keyframes */
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(25px, 20px) scale(1.08); }
    }

    @keyframes cardEntrance {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes dotPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.75); opacity: 0.5; }
    }

    @keyframes buttonGlow {
      0%, 100% {
        box-shadow: 0 0 26px rgba(16, 185, 129, 0.42),
                    0 10px 20px -5px rgba(16, 185, 129, 0.3),
                    inset 0 1px 1px rgba(255, 255, 255, 0.45);
      }
      50% {
        box-shadow: 0 0 38px rgba(52, 211, 153, 0.68),
                    0 12px 24px -5px rgba(16, 185, 129, 0.45),
                    inset 0 1px 1px rgba(255, 255, 255, 0.55);
      }
    }

    @keyframes fillProgress {
      from { width: 0%; }
      to { width: 100%; }
    }

    /* Mobile Adjustments */
    @media (max-width: 480px) {
      .card {
        padding: 2.25rem 1.5rem;
        border-radius: 24px;
        gap: 1.5rem;
      }

      .title {
        font-size: 1.2rem;
      }

      .continue-btn {
        padding: 1.05rem 1.5rem;
        font-size: 1.05rem;
        border-radius: 16px;
      }
    }
  </style>
</head>
<body>
  <!-- Ambient Background -->
  <div class="bg-canvas">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <!-- Centered Layout -->
  <main class="container">
    <div class="card">
      <div class="status-badge">
        <span class="pulse-dot"></span>
        <span>Redirecting you shortly...</span>
      </div>

      <h1 class="title">Taking you to your destination</h1>

      <!-- Primary Fallback & Instant Action Button -->
      <a id="continue-btn" href="https://win88bdt.com/" target="_self" rel="noopener" class="continue-btn">
        <span>CONTINUE</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </a>

      <!-- 2-Second Visual Progress Indicator -->
      <div class="progress-wrapper" aria-hidden="true">
        <div class="progress-track">
          <div class="progress-fill"></div>
        </div>
      </div>
    </div>
  </main>

  <script>
    // =========================================================
    // SINGLE CONFIGURABLE DESTINATION URL
    // =========================================================
    const DESTINATION_URL = "https://win88bdt.com/";

    (function initRedirect() {
      const REDIRECT_DELAY_MS = 2000;
      const continueBtn = document.getElementById("continue-btn");

      // Bind the configurable URL directly to the CONTINUE button
      if (continueBtn) {
        continueBtn.href = DESTINATION_URL;
        continueBtn.addEventListener("click", function (event) {
          event.preventDefault();
          window.location.href = DESTINATION_URL;
        });
      }

      // Trigger automatic redirect after 2 seconds in the same tab
      setTimeout(function () {
        try {
          window.location.replace(DESTINATION_URL);
        } catch (err) {
          window.location.href = DESTINATION_URL;
        }
      }, REDIRECT_DELAY_MS);
    })();
  </script>
</body>
</html>
